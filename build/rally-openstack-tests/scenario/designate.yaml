  DesignateBasic.create_and_delete_zone:
    -
      runner:
        {{ constant_runner(concurrency=min(50, 4*controllers_amount),times=min(30, 10*controllers_amount), is_smoke=smoke) }}
      context:
        {{ user_context(tenants_amount, users_amount, use_existing_users) }}
      sla:
        {{ no_failures_sla() }}
  DesignateBasic.create_and_delete_recordsets:
    -
      args:
        recordsets_per_zone: 1
      runner:
        {{ constant_runner(concurrency=min(50, 4*controllers_amount),times=min(30, 10*controllers_amount), is_smoke=smoke) }}
      context:
        {% call user_context(tenants_amount, users_amount, use_existing_users) %}
        zones:
          zones_per_tenant: 1
        {% endcall %}
      sla:
        {{ no_failures_sla() }}
  DesignateBasic.create_and_list_recordsets:
    -
      args:
        recordsets_per_zone: 1
      runner:
        {{ constant_runner(concurrency=min(50, 4*controllers_amount),times=min(30, 10*controllers_amount), is_smoke=smoke) }}
      context:
        {% call user_context(tenants_amount, users_amount, use_existing_users) %}
        zones:
          zones_per_tenant: 1
        {% endcall %}
      sla:
        {{ no_failures_sla() }}
  DesignateBasic.create_and_list_zones:
    -
      runner:
        {{ constant_runner(concurrency=min(50, 4*controllers_amount),times=min(30, 10*controllers_amount), is_smoke=smoke) }}
      context:
        {{ user_context(tenants_amount, users_amount, use_existing_users) }}
      sla:
        {{ no_failures_sla() }}
  DesignateBasic.list_zones:
    -
      runner:
        {{ constant_runner(concurrency=min(50, 4*controllers_amount),times=min(30, 10*controllers_amount), is_smoke=smoke) }}
      context:
        {{ user_context(tenants_amount, users_amount, use_existing_users) }}
      sla:
        {{ no_failures_sla() }}
 
